name: Qwen Dual-View Quality Audit & Remediation

on:
  schedule:
    # Runs every 30 minutes 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of dual view articles to audit'
        required: false
        default: '250'
        type: string
      dry_run:
        description: 'Dry run mode (preview decisions without updating Firestore)'
        required: false
        default: false
        type: boolean

concurrency:
  group: dual-views-audit
  cancel-in-progress: false

jobs:
  audit-dual-views:
    name: Qwen Dual-View Coherence & Quality Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Ollama & Local Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            .models/
          key: ${{ runner.os }}-ollama-qwen-v1
          restore-keys: |
            ${{ runner.os }}-ollama-qwen-

      - name: Cache Python Virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-audit-venv-${{ hashFiles('requirements.txt') }}

      - name: Install Python Dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip --quiet
          pip install --prefer-binary -r requirements.txt --quiet

      - name: Install & Start Local Ollama (Qwen)
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          echo "Starting Ollama daemon in background..."
          ollama serve &
          sleep 4
          echo "Verifying / Pulling fast Qwen 2.5 model for audit..."
          ollama pull qwen2.5:1.5b || ollama pull qwen2.5:3b || echo "Ollama pull ready."

      - name: Execute Dual-View Quality Audit
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID || 'versus-69e13' }}
          FIRESTORE_COLLECTION_ARTICLES: 'articles'
          ENABLE_LOCAL_FALLBACK: 'true'
        run: |
          source .venv/bin/activate
          LIMIT="${{ inputs.limit || '250' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Running in DRY-RUN mode (Limit: $LIMIT)..."
            python scripts/audit_dual_views.py --dry-run --limit "$LIMIT" --batch-size 15 --max-runtime 900
          else
            echo "Running in LIVE APPLY mode (Limit: $LIMIT)..."
            python scripts/audit_dual_views.py --apply --limit "$LIMIT" --batch-size 15 --max-runtime 900
          fi
