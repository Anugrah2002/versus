name: 30-Minute RSS Ingestion & Dual-Perspective Synthesis Pipeline

on:
  schedule:
    # Runs every 30 minutes (24/7)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows manual runs from GitHub Actions UI

concurrency:
  group: versus-ingestion
  cancel-in-progress: false

jobs:
  ingest-and-synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Embedding Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-minilm-v2
          restore-keys: |
            ${{ runner.os }}-hf-minilm-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --prefer-binary -r requirements.txt --quiet

      - name: Run Ingestion Pipeline
        env:
          # AI Provider Secrets (Injected from GitHub Repository Secrets)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: '@cf/meta/llama-3.1-8b-instruct-fp8-fast'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # Firebase Firestore Secrets
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID || 'versus-news' }}
          
          # Pipeline Parameters
          MAX_FEEDS_CONCURRENT: '35'
          PER_DOMAIN_MAX_CONCURRENT: '2'
          SIMILARITY_DISTANCE_THRESHOLD: '0.38'
          DATA_RETENTION_DAYS: '30'
          ENABLE_LOCAL_FALLBACK: 'true'
          DRY_RUN: 'false'
        run: |
          python src/main.py
